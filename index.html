<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Park</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="hero pop-up reveal" id="home">
        <div class="animate">
            <h1>
                Hi, I'm Daniel Park
            </h1>
            <p>
                <span class="identity-list">
                    Software Developer
                </span>
            </p>
        </div>
    </section>

    <section class="hero experience" id="experience">
        <h2 class="section-heading">Experience</h2>
        <div class="timeline">
            <div class="timeline-item left-to-right reveal">
                <div class="animate">
                    <a href="stuyvesant.html" class="section-link">
                        <h3 class="pop-up-hover">Stuyvesant High School</h3>
                    </a>
                    <span class="timeline-date">Class of 2025</span>
                </div>
            </div>

            <div class="timeline-item right-to-left reveal">
                <div class="animate">
                    <a href="bloomberg.html" class="section-link">
                        <h3 class="pop-up-hover">Bloomberg Software Engineer Intern</h3>
                    </a>
                    <span class="timeline-date">July - August 2024</span>
                </div>
            </div>
        </div>
    </section>

    <section class="hero gallery reveal" id="gallery">
        <h2 class="section-heading animate">Gallery</h2>
        <div class="images">
            <img src="images/img1.jpg" alt="" class="animate" style="--i:0;" loading="lazy">
            <img src="images/img1.jpg" alt="" class="animate" style="--i:1;" loading="lazy">
            <img src="images/img1.jpg" alt="" class="animate" style="--i:2;" loading="lazy">
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
