<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Park</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- The screen, and nothing but the screen: status bar, the stage the
         menus slide through, and a hint strip where the wheel used to be. -->
    <div class="ipod">

        <div class="ipod-bar">
            <a class="ipod-back" href="index.html" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg>
                <span>Menu</span>
            </a>
            <span class="ipod-title">dPod</span>
            <span class="ipod-battery" aria-hidden="true"></span>
        </div>

        <div class="ipod-stage">
            <!-- menu screen: the list drives the highlight, the panel on the
                 right follows it, exactly one card shown at a time -->
            <main class="ipod-screen" data-hint="&uarr; &darr;;browse|&crarr;;select" data-screen="menu" data-title="dPod" data-parent="">

                <ul class="ipod-list">
                    <li>
                        <a class="ipod-row" href="about.html" data-preview="p-about" data-sub="Daniel Park">
                            <span class="ipod-label">About</span>
                            <span class="ipod-chev" aria-hidden="true">&rsaquo;</span>
                        </a>
                    </li>
                    <li>
                        <a class="ipod-row" href="projects.html" data-preview="p-projects" data-sub="Built and building">
                            <span class="ipod-label">Projects</span>
                            <span class="ipod-chev" aria-hidden="true">&rsaquo;</span>
                        </a>
                    </li>
                    <li>
                        <a class="ipod-row" href="courses.html" data-preview="p-courses" data-sub="Relevant coursework">
                            <span class="ipod-label">Courses</span>
                            <span class="ipod-chev" aria-hidden="true">&rsaquo;</span>
                        </a>
                    </li>
                    <li>
                        <a class="ipod-row" href="gallery.html" data-preview="p-gallery" data-sub="35 photos">
                            <span class="ipod-label">Gallery</span>
                            <span class="ipod-chev" aria-hidden="true">&rsaquo;</span>
                        </a>
                    </li>
                    <li>
                        <a class="ipod-row" href="contact.html" data-preview="p-contact" data-sub="Email &middot; GitHub &middot; LinkedIn">
                            <span class="ipod-label">Contact</span>
                            <span class="ipod-chev" aria-hidden="true">&rsaquo;</span>
                        </a>
                    </li>
                </ul>

                <div class="ipod-preview" aria-hidden="true">
                    <div class="ipod-card" id="p-about">
                        <div class="ipod-art"><img src="thumbs/profile.jpg" alt=""></div>
                        <span class="ipod-card-title">Daniel Park</span>
                        <span class="ipod-card-sub"><span class="identity-list" data-words="Software Developer|CMU 2029|Systems Developer">Software Developer</span></span>
                    </div>
                    <div class="ipod-card" id="p-projects">
                        <div class="ipod-art"><img src="thumbs/projects.jpg" alt=""></div>
                        <span class="ipod-card-title">Projects</span>
                        <span class="ipod-card-sub">Finished, and still in progress</span>
                    </div>
                    <div class="ipod-card" id="p-courses">
                        <div class="ipod-art"><img src="thumbs/cmu.jpg" alt=""></div>
                        <span class="ipod-card-title">Courses</span>
                        <span class="ipod-card-sub">Relevant coursework</span>
                    </div>
                    <div class="ipod-card" id="p-gallery">
                        <div class="ipod-art"><img src="thumbs/gallery.jpg" alt=""></div>
                        <span class="ipod-card-title">Gallery</span>
                        <span class="ipod-card-sub">A glimpse into my life, in coverflow</span>
                    </div>
                    <div class="ipod-card" id="p-contact">
                        <div class="ipod-art"><img src="thumbs/contact.jpg" alt=""></div>
                        <span class="ipod-card-title">Contact</span>
                        <span class="ipod-card-sub">Say hello</span>
                    </div>
                </div>

            </main>
        </div>

        <div class="ipod-hint">
            <span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> browse</span>
            <span><kbd>&crarr;</kbd> select</span>
            <span><kbd>esc</kbd> menu</span>
        </div>

    </div>

    <script src="gallery.js"></script>
    <script src="ipod.js"></script>
</body>

</html>
